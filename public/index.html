<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HWPX 양식 채우기</title>
<style>
  :root {
    --bg: #f8f9fa;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #1a202c;
    --muted: #718096;
    --accent: #3182ce;
    --accent-hover: #2b6cb0;
    --danger: #e53e3e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }
  .container { max-width: 720px; width: 100%; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
    font-size: 14px;
  }
  .field .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .field input[type="file"] {
    width: 100%;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
  }
  .actions { display: flex; gap: 10px; margin-top: 8px; }
  button {
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    background: var(--accent);
    color: #fff;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary { background: var(--muted); }
  button.secondary:hover { background: #4a5568; }
  #status {
    margin-top: 12px;
    padding: 10px 14px;
    border-radius: 6px;
    background: #ebf8ff;
    border: 1px solid #bee3f8;
    color: #2c5282;
    font-size: 13px;
    display: none;
  }
  #status.error { background: #fff5f5; border-color: #fed7d7; color: #c53030; }
  #result { display: none; }
  .report { font-size: 13px; }
  .report h3 { font-size: 15px; margin: 16px 0 6px; }
  .report h3:first-child { margin-top: 0; }
  .applied-item {
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }
  .applied-item:last-child { border-bottom: none; }
  .applied-item .name { font-weight: 500; }
  .applied-item .val { color: var(--muted); text-align: right; }
  .badge {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge-yes { background: #c6f6d5; color: #22543d; }
  .badge-estimate { background: #fefcbf; color: #744210; }
  .badge-no { background: #fed7d7; color: #742a2a; }
  .progress { margin-top: 12px; }
  .progress-bar-bg { height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; }
  .progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.2s ease; }
  .progress-stage { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .progress-pct { font-size: 13px; font-weight: 600; color: var(--text); }
  .result-line { font-size: 14px; margin-top: 6px; }
  .result-line .count { font-weight: 600; }
  .download-row { margin-top: 12px; }
  #downloadLink {
    display: none;
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
  }
  #downloadLink:hover { background: var(--accent-hover); }
  #downloadLink.show { display: inline-block; }
  #status { margin-top: 12px; }
</style>
</head>
<body>
<div class="container">
  <h1>HWPX 양식 채우기</h1>
  <p class="sub">A의 양식을 보존하고 B에서 필요한 내용을 찾아 선택한 칸에 채웁니다</p>
  <div class="card">
    <div class="field">
      <label for="fileA">A · 채울 양식</label>
      <input type="file" id="fileA" accept=".hwpx">
    </div>
    <div class="field">
      <label for="fileB">B · 원본 자료</label>
      <input type="file" id="fileB" accept=".hwpx,.txt,.md">
      <label for="sourceText">또는 내용 붙여넣기</label>
      <textarea id="sourceText" rows="6" style="width:100%" placeholder="파일 대신 원문을 붙여넣으세요"></textarea>
      <div class="hint">파일과 텍스트 중 하나를 사용하세요 · A와 B 합계 최대 2.5MB</div>
    </div>
    <div class="actions">
      <button id="runBtn">HWPXly💨</button>
      <button id="resetBtn" class="secondary">초기화</button>
    </div>
    <div id="progress" class="progress" style="display:none">
      <div class="progress-bar-bg"><div class="progress-bar" id="progressBar"></div></div>
      <div class="progress-stage" id="progressStage"></div>
      <div class="progress-pct" id="progressPct"></div>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
    <div class="download-row"><a id="downloadLink" download>작성본 HWPX 다운로드</a></div>
  </div>
</div>
<script src="/app.js" defer></script>
</body>
</html>
