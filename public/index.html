<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HWPX 서식 이식</title>
<style>
  :root {
    --bg: #f8f9fa;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #1a202c;
    --muted: #718096;
    --accent: #3182ce;
    --accent-hover: #2b6cb0;
    --danger: #e53e3e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }
  .container { max-width: 720px; width: 100%; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
    font-size: 14px;
  }
  .field .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .field input[type="file"] {
    width: 100%;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
  }
  .actions { display: flex; gap: 10px; margin-top: 8px; }
  button {
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    background: var(--accent);
    color: #fff;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary { background: var(--muted); }
  button.secondary:hover { background: #4a5568; }
  #status {
    margin-top: 12px;
    padding: 10px 14px;
    border-radius: 6px;
    background: #ebf8ff;
    border: 1px solid #bee3f8;
    color: #2c5282;
    font-size: 13px;
    display: none;
  }
  #status.error { background: #fff5f5; border-color: #fed7d7; color: #c53030; }
  #result { display: none; }
  .report { font-size: 13px; }
  .report h3 { font-size: 15px; margin: 16px 0 6px; }
  .report h3:first-child { margin-top: 0; }
  .applied-item {
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }
  .applied-item:last-child { border-bottom: none; }
  .applied-item .name { font-weight: 500; }
  .applied-item .val { color: var(--muted); text-align: right; }
  .badge {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge-yes { background: #c6f6d5; color: #22543d; }
  .badge-estimate { background: #fefcbf; color: #744210; }
  .badge-no { background: #fed7d7; color: #742a2a; }
  .download-row { margin-top: 16px; }
  .download-row a {
    display: inline-block;
    padding: 10px 20px;
    background: var(--accent);
    color: #fff;
    border-radius: 6px;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
  }
  .download-row a:hover { background: var(--accent-hover); }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #bee3f8; border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 6px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container">
  <h1>HWPX 서식 이식</h1>
  <p class="sub">A의 서식(스타일 템플릿) + B의 내용(내용 소스) → C의 서식 이식 결과 HWPX</p>

  <div class="card">
    <div class="field">
      <label for="fileA">A의 스타일 템플릿 (HWPX)</label>
      <input type="file" id="fileA" accept=".hwpx">
      <div class="hint">서식이 정의된 HWPX 파일 (예: 회사 표준 양식)</div>
    </div>
    <div class="field">
      <label for="fileB">B의 내용 소스 (HWPX)</label>
      <input type="file" id="fileB" accept=".hwpx">
      <div class="hint">내용 텍스트가 들어 있는 HWPX 파일 (예: 채울 내용)</div>
    </div>
    <div class="actions">
      <button id="runBtn" onclick="run()">이식 실행</button>
      <button class="secondary" onclick="resetForm()">초기화</button>
    </div>
    <div id="status"></div>
  </div>

  <div id="result">
    <div class="card report">
      <h3>이식 결과</h3>
      <div id="reportSummary"></div>
      <div class="download-row">
        <a id="downloadLink" href="#" download>C HWPX 다운로드</a>
      </div>
    </div>
  </div>
</div>

<script>
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');
const runBtn = document.getElementById('runBtn');
const downloadLink = document.getElementById('downloadLink');
const reportSummary = document.getElementById('reportSummary');

function showStatus(msg, isError) {
  statusEl.style.display = 'block';
  statusEl.textContent = msg;
  statusEl.classList.toggle('error', !!isError);
}

function hideStatus() {
  statusEl.style.display = 'none';
  statusEl.classList.remove('error');
}

function resetForm() {
  document.getElementById('fileA').value = '';
  document.getElementById('fileB').value = '';
  hideStatus();
  resultEl.style.display = 'none';
  runBtn.disabled = false;
}

async function run() {
  const fileA = document.getElementById('fileA').files[0];
  const fileB = document.getElementById('fileB').files[0];
  if (!fileA || !fileB) {
    showStatus('A와 B 파일을 모두 선택해 주세요.', true);
    return;
  }

  runBtn.disabled = true;
  showStatus('처리 중...');
  hideStatus();
  resultEl.style.display = 'none';

  try {
    const b64A = await readAsBase64(fileA);
    const b64B = await readAsBase64(fileB);

    const resp = await fetch('/api/transplant', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fileA: b64A, fileB: b64B, model: 'solar-pro4' })
    });

    if (!resp.ok) {
      const errBody = await resp.text();
      showStatus('서버 오류: ' + (resp.status || '') + ' ' + errBody.slice(0, 200), true);
      runBtn.disabled = false;
      return;
    }

    const data = await resp.json();
    if (data.status !== 'solar_reply_ok') {
      showStatus('예상치 못한 응답: ' + (data.error || JSON.stringify(data).slice(0, 200)), true);
      runBtn.disabled = false;
      return;
    }

    // 이식 보고서
    const report = data.transplant_report;
    let html = '';

    // roleMap 요약
    if (report && Array.isArray(report.roleMap)) {
      html += '<h3>역할 매핑 (B → A)</h3>';
      html += '<div style="font-size:13px;">';
      // 최대 8개까지
      const shown = report.roleMap.slice(0, 8);
      for (const rm of shown) {
        const fb = rm.fromB || '';
        const to = rm.toASlot || '';
        const fbShort = fb.length > 60 ? fb.slice(0, 60) + '…' : fb;
        html += `<div><b>B:</b> ${esc(fbShort)}<br><b>→ A 슬롯:</b> ${esc(to)} ${rm.fallback ? '(fallback)' : ''}</div>`;
      }
      if (report.roleMap.length > 8) {
        html += `<div style="color:var(--muted);margin-top:4px;">+ ${report.roleMap.length - 8}개 더</div>`;
      }
      html += '</div>';
    }

    // applied
    if (report && Array.isArray(report.applied)) {
      html += '<h3>적용된 서식 (A 값)</h3>';
      html += '<div class="applied-item"><span class="name">항목</span><span class="val">A 값 / 상태</span></div>';
      for (const it of report.applied) {
        const badge = it.status === 'yes' ? '<span class="badge badge-yes">yes</span>'
          : it.status === 'estimate' ? '<span class="badge badge-estimate">estimate</span>'
          : '<span class="badge badge-no">no</span>';
        html += `<div class="applied-item"><span class="name">${esc(it.item || '')}</span><span class="val">${esc(it.valueFromA || '')} ${badge}</span></div>`;
      }
    }

    // gaps
    if (report && Array.isArray(report.gaps) && report.gaps.length) {
      html += '<h3>누락 / 주의</h3>';
      html += '<ul style="margin:0;padding-left:18px;font-size:13px;color:var(--muted);">';
      for (const g of report.gaps) {
        html += `<li>${esc(g)}</li>`;
      }
      html += '</ul>';
    }

    reportSummary.innerHTML = html;

    // C HWPX 다운로드 링크
    if (data.C_hwpx_base64) {
      const blob = base64ToBlob(data.C_hwpx_base64, 'application/vnd.hancom.hwpx');
      const url = URL.createObjectURL(blob);
      downloadLink.href = url;
      downloadLink.download = data.C_hwpx_filename || 'C_서식이식.hwpx';
    } else {
      downloadLink.href = '#';
      downloadLink.download = '';
      downloadLink.style.display = 'none';
    }

    resultEl.style.display = 'block';
    showStatus('완료. 결과를 확인하세요.', false);
  } catch (err) {
    showStatus('오류: ' + (err && err.message ? err.message : String(err)), true);
  } finally {
    runBtn.disabled = false;
  }
}

function readAsBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  }).then(dataUrl => dataUrl.split(',')[1]);
}

function base64ToBlob(b64, mimeType) {
  const bytes = atob(b64);
  const ab = new ArrayBuffer(bytes.length);
  const ia = new Uint8Array(ab);
  for (let i = 0; i < bytes.length; i++) ia[i] = bytes.charCodeAt(i);
  return new Blob([ab], { type: mimeType });
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
